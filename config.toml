# gta-tr-subs yapılandırması. Tüm alanlar opsiyoneldir; varsayılanlar src/gta_tr_subs/config.py içinde.
log_level = "INFO"

[capture]
window_title = ""          # boşsa açılışta pencere seçtirilir ve buraya kaydedilir
backend = "wgc"            # "wgc" (pencere yakalama, önerilen) | "monitor" (DXGI yedeği)
monitor_index = 1          # backend = "monitor" iken kullanılacak monitör (1 tabanlı)
fps = 30
suggest_keywords = ["PS Remote Play", "Remote Play", "chiaki", "Projector", "Projektör"]

[roi]
calibrated = false         # ilk çalıştırmada kalibrasyon penceresi açılır
subtitle = { x = 0.10, y = 0.78, w = 0.80, h = 0.22 }   # pencereye oransal: alt %22, orta %80
# speaker = { x = 0.10, y = 0.72, w = 0.30, h = 0.05 }  # opsiyonel: konuşmacı adı bölgesi

[detect]
bright_threshold = 170     # altyazı pikseli sayılacak parlaklık (0-255)
downscale = 4
change_ratio = 0.06        # maske farkı bu oranın üstündeyse OCR tetiklenir
empty_ratio = 0.0015       # maske doluluğu bunun altındaysa "altyazı yok"
hide_delay_ms = 250
require_outline = false    # true: parlak pikselin yanında koyu kontur arar (parlak sahnelerde daha az sahte tetik)

[ocr]
engine = "windows"         # "windows" (Windows.Media.Ocr) | "rapid" (RapidOCR, `uv sync --extra rapid`)
language = "en-US"
max_hz = 15
upscale = 2.0
preprocess = "mask"        # "mask": siyah-beyaz metin maskesi (önerilen) | "gray": gri + kontrast
min_confidence = 0.5
min_chars = 2
min_alpha_ratio = 0.55
rapid_use_dml = false      # onnxruntime-directml kuruluysa GPU

[stabilize]
required_hits = 2          # aynı metin kaç ardışık OCR'da görülünce "kararlı"
required_misses = 2
similarity = 92
fast_confirm = true        # sonraki karede görüntü aynıysa 2. OCR'ı beklemeden onayla (~1 kare kazanç)
speculative = false        # true: ilk okumada çeviriyi önden başlat (~1 kare kazanç, ama ~2 kat API çağrısı)

[translate]
mode = "race"              # "race" (bulut ‖ yerel) | "cloud_first" | "local_only"
cloud_timeout_ms = 1200
context_lines = 3
breaker_failures = 2       # ardışık bulut hatası → devre açılır
breaker_cooldown_s = 30
glossary_path = "glossary.yaml"

[translate.gemini]
enabled = true
model = "gemini-3.5-flash-lite"   # örn. "gemini-flash-lite-latest"
temperature = 0.2
thinking = "auto"          # auto | off | minimal | low | default
stream_partials = true     # akış sırasında kısmi çeviriyi göster

[translate.ollama]
enabled = true
url = "http://localhost:11434"
model = "translategemma:4b"       # GPU bolsa "translategemma:12b"
keep_alive = "2h"
timeout_ms = 4000

[translate.ct2]
enabled = false            # `uv sync --extra ct2` + model dönüştürme (README)
model_dir = "models/opus-mt-tc-big-en-tr-ct2"

[cache]
db_path = "translations.db"
lru_size = 4096
cache_local_results = true

[overlay]
enabled = true
opacity = 0.82
font_family = "Segoe UI"
font_bold = true
max_lines = 3
show_english = false
show_badge = true
exclude_from_capture = true

[hotkeys]
toggle_overlay = "<f8>"
recalibrate = "<f9>"
toggle_english = "<f10>"
cycle_mode = "<f11>"
debug_panel = "<f12>"
