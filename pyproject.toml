[project]
name = "gta-tr-subs"
version = "0.1.0"
description = "PS5 (Remote Play / chiaki-ng / capture kartı) oyun altyazılarını ekrandan okuyup anında Türkçeye çeviren overlay"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "rapidfuzz>=3.6",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "tomlkit>=0.12",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "httpx>=0.27",
    "google-genai>=1.0",
    "PySide6>=6.6",
    "pynput>=1.7",
    "windows-capture>=1.4; sys_platform == 'win32'",
    "winrt-runtime>=2.3; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2.3; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=2.3; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=2.3; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=2.3; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr>=2.3; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=2.3; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Yedek OCR motoru (PaddleOCR modelleri, ONNX Runtime CPU)
rapid = ["rapidocr-onnxruntime>=1.3"]
# Katman 3: CTranslate2 + opus-mt (ultra hızlı CPU yedeği)
ct2 = ["ctranslate2>=4.0", "sentencepiece>=0.2"]

[project.scripts]
gta-tr-subs = "gta_tr_subs.main:main"

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gta_tr_subs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["tools"]
asyncio_default_fixture_loop_scope = "function"
